name: Build Windows Capture Agent Installer

'on':
  push:
    paths:
      - 'capture_agent/**'
      - '.github/workflows/build-windows-agent.yml'
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish generated installer to GitHub Release'
        required: false
        type: boolean
        default: false
      release_tag:
        description: 'GitHub Release tag to publish asset to (e.g. v1.0.1)'
        required: false
        type: string
        default: 'v1.0.1'

permissions:
  contents: write

jobs:
  build-windows-installer:
    name: Build & Validate Windows Installer (.exe)
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11 (64-bit)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'

      - name: Install Inno Setup Compiler (ISCC)
        run: choco install innosetup --no-progress

      - name: Verify Build Tools & Environment
        shell: cmd
        run: |
          echo === Python Info ===
          python --version
          where python
          echo === Inno Setup Compiler Info ===
          if exist "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" (
            echo Found ISCC at C:\Program Files ^(x86^)\Inno Setup 6\ISCC.exe
          ) else (
            where ISCC.exe
          )

      - name: Build Windows Capture Agent Installer
        shell: cmd
        run: |
          call capture_agent\windows\build_installer.bat

      - name: Validate Generated Installer Binary
        shell: bash
        run: |
          INSTALLER_PATH="dist/SecureMailScopeCaptureAgent-1.0.1-Setup.exe"

          if [ ! -f "$INSTALLER_PATH" ]; then
            echo "::error::Installer binary not found at $INSTALLER_PATH"
            exit 1
          fi

          FILE_SIZE=$(wc -c < "$INSTALLER_PATH" | tr -d ' ')
          echo "Generated Installer: $INSTALLER_PATH"
          echo "File Size: $FILE_SIZE bytes"

          # Minimum expected size for bundled self-contained payload is > 5 MB (5,000,000 bytes)
          if [ "$FILE_SIZE" -lt 5000000 ]; then
            echo "::error::Installer binary appears incomplete or too small ($FILE_SIZE bytes). Expected > 5MB."
            exit 1
          fi

          echo "Calculating SHA-256 checksum..."
          SHA256=$(sha256sum "$INSTALLER_PATH" | awk '{print $1}')
          echo "SHA-256: $SHA256"
          echo "SHA256=$SHA256" >> $GITHUB_ENV
          echo "[SUCCESS] Installer validation passed."

      - name: Validate Windows Service SCM Lifecycle & Live Startup
        shell: powershell
        run: |
          $stagedPy = (Resolve-Path "build\windows_payload\python\python.exe").Path
          $svcScript = (Resolve-Path "build\windows_payload\capture_agent\windows\service.py").Path
          $serviceName = "SecureMailScopeCaptureAgent"
          $logDir = "C:\ProgramData\SecureMailScope\CaptureAgent\logs"
          $logFile = Join-Path $logDir "service.log"
          $envFile = "C:\ProgramData\SecureMailScope\CaptureAgent\agent.env"

          Write-Host "=== Staged Python: $stagedPy ==="
          Write-Host "=== Service Script: $svcScript ==="

          # 1. Provision safe test configuration in ProgramData
          New-Item -ItemType Directory -Force -Path $logDir | Out-Null
          Set-Content -Path $envFile -Value @(
            "# Safe CI Test Configuration (Non-production)",
            "BACKEND_WS_URL=wss://securemailscope-130k.onrender.com/ws/agent",
            "CAPTURE_AGENT_SECRET_KEY=sms-capture-secret-dev-key",
            "CAPTURE_AGENT_API_KEY=sms-capture-secret-dev-key"
          ) -Encoding utf8

          try {
            # 2. Register Windows Service with SCM
            Write-Host "[*] Registering service with SCM..."
            & $stagedPy $svcScript --startup=auto install
            if ($LASTEXITCODE -ne 0) {
              throw "Service registration failed with exit code $LASTEXITCODE"
            }

            # 3. Verify SCM registration and query configuration
            Write-Host "[*] Querying service configuration in SCM..."
            & sc.exe qc $serviceName
            if ($LASTEXITCODE -ne 0) {
              throw "Service $serviceName is not registered in SCM"
            }

            # 4. Start Windows Service via SCM (invokes PythonService.exe)
            Write-Host "[*] Starting service via SCM..."
            & sc.exe start $serviceName
            $startExit = $LASTEXITCODE
            if ($startExit -ne 0 -and $startExit -ne 1056) {
              Write-Warning "sc.exe start returned code $startExit"
            }

            # 5. Poll for RUNNING state (up to 20 seconds)
            Write-Host "[*] Polling for service to reach RUNNING state..."
            $isRunning = $false
            for ($i = 1; $i -le 20; $i++) {
              Start-Sleep -Seconds 1
              $svc = Get-Service -Name $serviceName -ErrorAction SilentlyContinue
              if ($svc -and $svc.Status -eq 'Running') {
                $isRunning = $true
                Write-Host "[+] Service reached RUNNING state in ${i} seconds!"
                break
              }
              Write-Host "    Attempt ${i}: Status is $($svc.Status)"
            }

            if (-not $isRunning) {
              throw "Service failed to reach RUNNING state within 20 seconds."
            }

            # 6. Verify port 9000 TCP listener is actively bound
            Write-Host "[*] Checking port 9000 TCP listener..."
            $portListening = $false
            for ($p = 1; $p -le 15; $p++) {
              $conns = Get-NetTCPConnection -LocalPort 9000 -State Listen -ErrorAction SilentlyContinue
              if ($conns) {
                $portListening = $true
                Write-Host "[+] Port 9000 is actively LISTENING (OwningProcess: $($conns.OwningProcess))"
                break
              }
              Start-Sleep -Seconds 1
            }

            if (-not $portListening) {
              throw "Capture Agent service is RUNNING, but port 9000 is NOT listening."
            }

            # 7. Validate initial HTTP health check (before or during WSS initialization)
            Write-Host "[*] Validating initial agent health check (http://127.0.0.1:9000/health)..."
            $initialHealthy = $false
            for ($j = 1; $j -le 10; $j++) {
              try {
                $resp = Invoke-RestMethod -Uri "http://127.0.0.1:9000/health" -TimeoutSec 3 -ErrorAction Stop
                if ($resp.status -eq "ok") {
                  $initialHealthy = $true
                  Write-Host "[+] Initial HTTP /health responded 200 OK: $($resp | ConvertTo-Json -Compress)"
                  break
                }
              } catch {
                Start-Sleep -Seconds 1
              }
            }

            if (-not $initialHealthy) {
              throw "Initial health check failed: http://127.0.0.1:9000/health did not respond."
            }

            # 8. Allow WebSocket bridge to connect to backend hub
            Write-Host "[*] Waiting 6 seconds for WebSocket bridge background connection to backend hub..."
            Start-Sleep -Seconds 6

            # 9. Verify port 9000 remains listening after WSS bridge is connected
            $connsPostWs = Get-NetTCPConnection -LocalPort 9000 -State Listen -ErrorAction SilentlyContinue
            if (-not $connsPostWs) {
              throw "Port 9000 listener disappeared after WebSocket bridge connected!"
            }
            Write-Host "[+] Port 9000 remains actively LISTENING after WebSocket bridge activity."

            # 10. Validate HTTP health check while WSS bridge is active
            Write-Host "[*] Validating HTTP health after WebSocket bridge connection..."
            $postWsResp = Invoke-RestMethod -Uri "http://127.0.0.1:9000/health" -TimeoutSec 3 -ErrorAction Stop
            if ($postWsResp.status -ne "ok") {
              throw "Post-WSS HTTP /health status was not OK: $($postWsResp | ConvertTo-Json -Compress)"
            }
            Write-Host "[+] HTTP /health responded 200 OK after WSS bridge connected: $($postWsResp | ConvertTo-Json -Compress)"

            # 11. Test rapid connection bursts and verify listener survives
            Write-Host "[*] Testing rapid requests and connection reset resilience..."
            for ($k = 1; $k -le 5; $k++) {
              $respK = Invoke-RestMethod -Uri "http://127.0.0.1:9000/health" -TimeoutSec 2 -ErrorAction Stop
              if ($respK.status -ne "ok") {
                throw "Rapid request failed at iteration ${k}"
              }
            }
            Write-Host "[+] Listener survived 5 rapid connection cycles and remains healthy."

            # 12. Stop service cleanly via SCM
            Write-Host "[*] Stopping service cleanly via SCM..."
            & sc.exe stop $serviceName
            $stopped = $false
            for ($s = 1; $s -le 15; $s++) {
              Start-Sleep -Seconds 1
              $svc = Get-Service -Name $serviceName -ErrorAction SilentlyContinue
              if ($svc -and $svc.Status -eq 'Stopped') {
                $stopped = $true
                Write-Host "[+] Service reached STOPPED state in ${s} seconds."
                break
              }
            }

            if (-not $stopped) {
              Write-Warning "Service did not report STOPPED within 15 seconds."
            }

            Write-Host "[SUCCESS] Windows Service SCM lifecycle, HTTP health, and WSS bridge resilience validated successfully!"
          }
          catch {
            Write-Error "[-] Service startup validation failure: $_"

            Write-Host "=== Diagnostic: sc queryex ==="
            & sc.exe queryex $serviceName

            if (Test-Path $logFile) {
              Write-Host "=== Diagnostic: service.log ==="
              Get-Content $logFile -Tail 100
            } else {
              Write-Host "=== Diagnostic: service.log does not exist ==="
            }

            Write-Host "=== Diagnostic: System Event Log (SCM) ==="
            try {
              Get-WinEvent -FilterHashtable @{LogName='System'; ProviderName='Service Control Manager'} -MaxEvents 10 -ErrorAction SilentlyContinue |
                Format-Table TimeCreated, Id, Message -Wrap | Out-String | Write-Host
            } catch {}

            Write-Host "=== Diagnostic: Application Event Log ==="
            try {
              Get-WinEvent -FilterHashtable @{LogName='Application'} -MaxEvents 10 -ErrorAction SilentlyContinue |
                Format-Table TimeCreated, Id, Message -Wrap | Out-String | Write-Host
            } catch {}

            exit 1
          }
          finally {
            Write-Host "[*] Cleaning up test service..."
            & sc.exe stop $serviceName | Out-Null
            Start-Sleep -Seconds 2
            & $stagedPy $svcScript remove | Out-Null
            Write-Host "[+] Cleanup completed."
          }

      - name: Upload Installer as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SecureMailScopeCaptureAgent-1.0.1-Setup
          path: dist/SecureMailScopeCaptureAgent-1.0.1-Setup.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish to GitHub Release
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.publish_release == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.inputs.release_tag || 'v1.0.1' }}
        run: |
          INSTALLER_PATH="dist/SecureMailScopeCaptureAgent-1.0.1-Setup.exe"
          echo "Publishing $INSTALLER_PATH to release '${RELEASE_TAG}'..."

          if ! gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Release '${RELEASE_TAG}' not found. Creating release..."
            gh release create "${RELEASE_TAG}" "$INSTALLER_PATH" \
              --title "SecureMailScope ${RELEASE_TAG}" \
              --notes "Official release of the SecureMailScope Windows Capture Agent standalone installer."
          else
            echo "Release '${RELEASE_TAG}' found. Uploading asset with overwrite protection..."
            gh release upload "${RELEASE_TAG}" "$INSTALLER_PATH" --clobber
          fi

          echo "[SUCCESS] Published SecureMailScopeCaptureAgent-1.0.1-Setup.exe to GitHub Release '${RELEASE_TAG}'."
